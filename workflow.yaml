nodes:
  - id: 1
    name: Start
    plugin: default
    type: trigger
    parameters: {}

  - id: 2
    name: Fetch Data
    plugin: http
    type: action
    parameters:
      url: "https://httpbin.org/basic-auth/user/pass"
      method: GET
      basic_auth:
          username: user
          password: pass

  - id: 3
    name: Send Data
    plugin: http
    type: action
    parameters:
      url: "http://httpbin.org/post"
      method: POST
      data:
        format: json
        raw_message: "raw message"
        form_parameters:
          - key1: value1
          - key2: value2
        json_message: '{"key1": "value1", "key2": 20}'
      bearer_auth: my_token
      headers:
        - Content-Type: application/json
        - Accept: application/json
        - Host: httpbin.org
    
  - id: 4
    name: Delete
    plugin: http
    type: action
    parameters:
      url: "http://httpbun.com/delete"
      method: DELETE
  
  - id: 5
    name: Patch
    plugin: http
    type: action
    parameters:
      url: "http://httpbun.com/patch"
      method: PATCH
      
  - id: 6
    name: Put
    plugin: http
    type: action
    parameters:
      url: "http://httpbun.com/put"
      method: PUT

  - id: 7
    name: Send Mail
    plugin: send_mail
    type: action
    parameters:
      from: "sender@gmail.com"
      reply_to: "sender@gmail.com"
      to: "receiver@gmail.com"
      subject: "Test Subject"
      body: "Test Body"
      smtp_host: smtp.gmail.com
      smtp_port: 465
      smtp_user: "sender@gmail.com"
      smtp_password: "__PASSWORD__"

connections:
  "1":
    - to: 2
  "2":
    - to: 7